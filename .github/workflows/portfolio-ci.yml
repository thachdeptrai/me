name: THACH.OS Reborn — verify & capture
on:
  push:
    branches: ["feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reborn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static production site
        run: npm run build
      - name: Unit / source / component contract tests
        run: npm test
      - name: HTTP smoke under /me/
        run: |
          node scripts/serve.mjs --port 4173 & SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4173/me/ -o /tmp/me-index && break; sleep 1; done
          grep -q 'THACH.OS REBORN' /tmp/me-index
          curl -fsSI http://127.0.0.1:4173/me/src/world.js | grep -qi '200 OK'
          curl -fsSI http://127.0.0.1:4173/me/src/style.css | grep -qi '200 OK'
          curl -fsSI http://127.0.0.1:4173/me/src/app.js | grep -qi '200 OK'
      - name: Chromium browser E2E (when available)
        run: |
          if command -v chromium >/dev/null || command -v google-chrome >/dev/null; then
            npm run test:e2e
          else
            echo '::notice::Chromium not present; browser E2E not run on this runner.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thach-os-reborn-browser
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
